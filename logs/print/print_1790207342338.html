<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ใบจัดยา - นายชานนท์  ภูผานี</title>
    <style>
        @page {
            size: 80mm 70mm landscape;
            margin: 0;
        }
        /* ใบสรุป: ถ้าเนื้อหาล้นต่อเป็นแผ่นที่ 2 ขึ้นไป ให้ขยับลง 1cm (ไม่กระทบสติกเกอร์ยาหน้าอื่นๆ) */
        @page summary {
            size: 80mm 70mm landscape;
            margin: 10mm 0 0 0;
        }
        @page summary:first {
            margin-top: 0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Sarabun', 'TH Sarabun New', 'Tahoma', sans-serif;
            color: #000;
            width: 80mm;
            line-height: 1.3;
        }
        .page {
            width: 80mm;
            height: 70mm;
            overflow: hidden;
            position: relative;
        }
        /* ── Summary page (first page: all drugs overview) ── */
        .summary-page {
            page: summary;
            padding: 3mm 4mm;
            display: block;
            height: auto;
            min-height: 70mm;
            overflow: visible;
        }
        .summary-qrcode {
            width: 14mm;
            height: 14mm;
            flex-shrink: 0;
        }
        .summary-qrcode img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* ── Drug sticker pages ── */
        .drug-page {
            page-break-before: always;
            break-before: page;
            display: flex;
            flex-direction: column;
        }
        .drug-header {
            background: #f5c400;
            padding: 2.5mm 4mm;
            border-bottom: 1.5px solid #000;
            text-align: center;
            flex-shrink: 0;
        }
        .drug-hospital {
            font-size: 8pt;
            font-weight: 800;
            line-height: 1.35;
            word-break: break-word;
        }
        .drug-body {
            padding: 11mm 4mm 16mm 4mm;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1mm;
            position: relative;
            overflow: hidden;
        }
        .drug-meta {
            font-size: 9pt;
            font-weight: 600;
            line-height: 1.15;
            word-break: break-word;
        }
        .drug-hn {
            font-size: 9pt;
            font-weight: 700;
            line-height: 1.15;
            margin-top: 1.5mm;
            word-break: break-word;
        }
        .drug-patient {
            font-size: 14pt;
            font-weight: 800;
            line-height: 1.15;
            border-bottom: 1.5px dashed #000;
            padding-bottom: 1.5mm;
            margin-bottom: 0.5mm;
            word-break: break-word;
        }
        .drug-name {
            font-size: 10pt;
            font-weight: 800;
            word-break: break-word;
            line-height: 1.15;
        }
        .drug-qty {
            font-weight: 800;
        }
        .drug-timecode {
            font-size: 11pt;
            font-weight: 700;
            line-height: 1.15;
        }
        .drug-inst {
            font-size: 10pt;
            font-weight: 600;
            line-height: 1.15;
            word-break: break-word;
        }
        .drug-location {
            position: absolute;
            bottom: 4mm;
            left: 4mm;
            font-size: 10pt;
            font-weight: 800;
            border: 1.5px solid #000;
            border-radius: 4px;
            padding: 1px 6px;
            background: #fff;
        }
        .drug-qrcode {
            position: absolute;
            bottom: 4mm;
            right: 3mm;
            width: 11mm;
            height: 11mm;
            border: none;
            padding: 0;
            background: #fff;
        }
        .drug-qrcode img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* ── Summary page styles ── */
        .header {
            border-bottom: 1.5px dashed #000;
            padding-top: 7mm;
            padding-bottom: 4px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            break-inside: avoid;
        }
        .header-top {
            font-size: 9pt;
            font-weight: 700;
            display: flex;
            gap: 10px;
        }
        .header-name {
            font-size: 11pt;
            font-weight: 800;
            margin-top: 2px;
            word-break: break-word;
        }
        .location-section { margin-bottom: 5px; }
        .location-title {
            font-weight: 800;
            font-size: 8pt;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 1px 5px;
            border-radius: 2px;
            margin-bottom: 3px;
            break-inside: avoid;
            break-after: avoid;
        }
        .med-item {
            font-size: 8pt;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2.5px;
            break-inside: avoid;
        }
        .med-name { font-weight: 600; flex: 1; padding-right: 5px; word-break: break-word; }
        .med-bin  { font-weight: 500; color: #b45309; }
        .med-qty  { font-weight: 800; white-space: nowrap; }
    </style>
</head>
